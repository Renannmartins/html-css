<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes externas</title>
    <style>

        @font-face {
            font-family:"Filxgirl";
            src: url('fonts/Filxgirl.TTF') format(truetype);
            font-weight: normal;
            font-style: normal;

            /*Tipos de format()
            -Opentype (otf)
            - truetype (ttf)
            - enbedded - opentype
            - truetype - aat (apple advanced typografhy
            - svg */
        }
        body {
            font-family: Arial, Helvetica, sans-serif;

        }
        h1 {
            font-family: 'Filxgirl';
            font-size: 3em;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <h1>Olá mundo</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Eos eligendi autem numquam cumque tempore quam fuga laboriosam sequi? Enim accusamus magni sequi commodi molestiae incidunt nulla praesentium nisi placeat illo!</p>
</body>
</html>
